name: Radar SECOP

on:
  schedule:
    # Cada hora (hora UTC). GitHub puede demorar unos minutos el inicio.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar-secop
  cancel-in-progress: false

jobs:
  radar:
    # PAUSADO: Gmail rechazó la contraseña de aplicación. Quitar esta línea
    # cuando se actualice el secreto SMTP_CLAVE.
    if: false
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PUERTO: ${{ secrets.SMTP_PUERTO }}
      SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
      SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
      CORREO_REMITENTE: ${{ secrets.CORREO_REMITENTE }}
      CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
    timeout-minutes: 20
    steps:
      - name: Verificar configuración
        if: env.SMTP_USUARIO == '' || env.SMTP_CLAVE == ''
        run: echo "::warning::Faltan los secretos del correo (SMTP_USUARIO, SMTP_CLAVE...). Configúrelos en Settings > Secrets and variables > Actions. El radar no hará nada hasta entonces."

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      - name: Revisar SECOP y enviar correo
        if: env.SMTP_USUARIO != '' && env.SMTP_CLAVE != ''
        run: python -m radar_ips

      - name: Guardar procesos ya vistos
        if: env.SMTP_USUARIO != '' && env.SMTP_CLAVE != ''
        run: |
          git config user.name "radar-ips-bot"
          git config user.email "radar-ips-bot@users.noreply.github.com"
          git add data/vistos.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar procesos vistos"
            git pull --rebase
            git push
          fi
