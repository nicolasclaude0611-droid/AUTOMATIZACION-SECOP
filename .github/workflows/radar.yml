name: Radar SECOP

on:
  schedule:
    # Cada hora (hora UTC). GitHub puede demorar unos minutos el inicio.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar-secop
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      - name: Revisar SECOP y enviar correo
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PUERTO: ${{ secrets.SMTP_PUERTO }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          CORREO_REMITENTE: ${{ secrets.CORREO_REMITENTE }}
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
        run: python -m radar_ips

      - name: Guardar procesos ya vistos
        run: |
          git config user.name "radar-ips-bot"
          git config user.email "radar-ips-bot@users.noreply.github.com"
          git add data/vistos.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar procesos vistos"
            git push
          fi
