[sector_salud]
# Términos generales del sector salud (suman puntos de "sector salud").
palabras = ["salud", "medic*", "paciente", "ips", "e.s.e", "ese hospital", "hospital", "eps", "atencion integral",
  "servicios de salud", "prestacion de servicios de salud", "enfermeria", "clinic*", "sanitari*", "poblacion vulnerable"]

[exclusiones]
# Términos que indican que el proceso probablemente NO es de interés.
palabras = ["suministro de medicamentos", "compra de medicamentos", "adquisicion de medicamentos", "dispositivos medicos",
  "adquisicion de equipos", "compra de equipos", "dotacion", "mobiliario", "construccion", "obra", "obras", "mantenimiento",
  "adecuacion", "remodelacion", "aseo", "vigilancia", "cafeteria", "combustible", "papeleria", "vehiculo", "transporte",
  "software", "auxiliar de facturacion", "apoyo a la gestion", "suministro de", "insumos", "implementos",
  "elementos", "adquirir", "adquisicion de", "compraventa", "piezas", "senalizacion*", "auditoria", "acueducto",
  "alcantarillado", "via", "vias", "pavimentacion", "interventoria"]

[contratos_individuales]
# Frases típicas de contratos con una sola persona (OPS), que no son una
# oportunidad para la IPS. Restan el puntaje completo de exclusión aunque
# mencionen un servicio de interés.
palabras = ["servicios profesionales como", "servicios profesionales de un", "servicios profesionales de una",
  "como auxiliar", "un auxiliar", "una auxiliar", "auxiliar de enfermeria", "como medico", "como enfermer*",
  "como jefe", "como odontolog*", "como bacteriolog*", "como psicolog*", "como fisioterapeut*", "como nutricionista",
  "como terapeuta", "como regente", "como tecnico", "como tecnologo", "como profesional", "como higienista",
  "como conductor", "como promotor*", "persona natural", "servicio de tecnico", "servicios tecnologos", "como citohistolog*", "como cito*", "como instrumentador*",
  "como radiolog*", "como especialista", "como gerente", "como asesor*", "apoyo a la gestion"]
