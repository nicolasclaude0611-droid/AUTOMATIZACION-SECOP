[servicios.salud_ocupacional]
nombre = "Salud ocupacional"
activo = true
palabras = ["salud ocupacional", "seguridad y salud en el trabajo", "sst", "examenes ocupacionales", "examenes medicos ocupacionales",
  "examenes de ingreso", "examenes periodicos", "medicina del trabajo", "medicina laboral"]

[servicios.domiciliaria]
