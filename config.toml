# =====================================================================
# RADAR IPS - Configuración
# Edite este archivo para ajustar qué procesos le llegan por correo.
# Las palabras se comparan sin tildes y sin distinguir mayúsculas.
# Una palabra que termina en * coincide con cualquier terminación
# (ej. "medic*" encuentra medico, medica, medicina).
# =====================================================================

[general]
# Días hacia atrás que se revisan en cada consulta. Los datos abiertos de
# SECOP llegan con retraso, por eso se revisa una ventana amplia; los
# procesos ya notificados no se vuelven a enviar.
dias_a_revisar = 7

# Puntaje mínimo (0-100) para enviar un proceso por correo.
#   85-100 alta | 65-84 media | 40-64 baja | <40 muy baja
puntaje_minimo = 65

# Si es true, solo se notifican procesos que mencionen al menos uno de
# los servicios de interés (recomendado para evitar ruido).
requerir_servicio = true

# Si es true, solo se notifican procesos de los departamentos/municipios de
# cobertura. Importante para las alertas de SECOP II, que llegan de todo el país.
requerir_ubicacion = true

# Asunto del correo
asunto = "RADAR IPS - Nuevas oportunidades SECOP"

[cobertura]
departamentos = ["Cesar", "La Guajira", "Guajira"]
# Municipios que se buscan dentro del texto del proceso. No se incluyen los
# que tienen el mismo nombre que municipios de otros departamentos (La Paz,
# San Diego, El Paso, San Martín, González, Albania, Villanueva, Manaure,
# Barrancas, La Gloria): para esos debe aparecer también el departamento.
municipios = [
  # Cesar
  "Valledupar", "Aguachica", "Agustin Codazzi", "Codazzi", "Astrea", "Becerril", "Bosconia",
  "Chimichagua", "Chiriguana", "Curumani", "El Copey", "Gamarra",
  "La Jagua de Ibirico", "Manaure Balcon del Cesar",
  "Pailitas", "Pelaya", "Pueblo Bello", "Rio de Oro", "San Alberto", "Tamalameque",
  # La Guajira
  "Riohacha", "Dibulla", "Distraccion", "El Molino",
  "Fonseca", "Hatonuevo", "La Jagua del Pilar", "Maicao", "San Juan del Cesar",
  "Uribia", "Urumita",
]

[buzon]
# Lectura de las alertas oficiales de SECOP II que llegan por correo.
# Se buscan correos cuyo remitente contenga alguno de estos textos.
remitentes = ["secop", "colombiacompra"]
# Carpetas del buzón a revisar (en Gmail: "INBOX", "[Gmail]/All Mail", ...)
carpetas = ["INBOX"]
# Días hacia atrás que se revisan en el buzón.
dias_a_revisar = 2
asunto = "RADAR IPS - ALERTA SECOP II"

[modalidades]
# Modalidades que NO se notifican porque normalmente el contratista ya
# está elegido (no hay competencia abierta). Bórrelas de la lista si
# quiere verlas igual.
excluir = [
  "Contratación directa",
  "Contratación régimen especial",
  "Contratación Directa (Ley 1150 de 2007)",
  "Licitación pública Obra Publica",
]

[puntaje]
# Pesos del puntaje de afinidad (deben sumar 100).
servicios = 35
ubicacion = 20
unspsc = 20
sector_salud = 15
estado = 10
# Puntos que se restan si aparece un término de exclusión.
penalizacion_exclusion = 40
# Penalización menor si hay exclusión pero también un servicio de interés
# (proceso mixto que puede ser una oportunidad real).
penalizacion_mixto = 20

[unspsc]
# Clases UNSPSC (6 dígitos) que corresponden al portafolio de la IPS.
# Un código del proceso que empiece por alguna de estas suma puntos.
prefijos = [
  "851015",  # Centros de salud
  "851016",  # Personas de soporte de prestación de servicios de salud
  "851017",  # Servicios de administración de salud
  "851115",  # Prevención y control de enfermedades contagiosas (PAI, VPH)
  "851116",  # Prevención y control de enfermedades no contagiosas (crónicos, cáncer)
  "851215",  # Servicios de prestadores de cuidado primario
  "851216",  # Servicios médicos de doctores especialistas
  "851217",  # Servicios de prestadores especialistas de servicios de salud
  "851218",  # Laboratorios médicos
  "851221",  # Servicios de rehabilitación
  "851222",  # Servicios de evaluación y valoración de salud individual (ocupacional)
  "851516",  # Asuntos nutricionales
]

# ---------------------------------------------------------------------
# Servicios de interés y sus palabras clave / sinónimos.
# Para desactivar un servicio ponga activo = false.
